async function initShared() {
  if (STANDALONE) { dbState = 'local'; return; }
  const timer = setTimeout(() => { if (dbState === 'loading') { dbState = 'off'; refreshShared(); } }, 10000);
  try {
    for (let i = 0; i < 15 && !(window.claude && typeof window.claude.use === 'function'); i++) await new Promise(r => setTimeout(r, 200));
    if (!window.claude || typeof window.claude.use !== 'function') throw new Error('absent');
    db = await window.claude.use('db');
    user = await window.claude.use('user');
    if (!db) throw new Error('absent');
    if (user) { try { myId = await user.id(); } catch (e) {} }
    db.collection('scores').orderBy('valeur', 'desc').limit(200).onSnapshot(snap => {
      clearTimeout(timer); dbState = 'on'; dbReady = true; boardErr = '';
      board = snap.docs.map(d => Object.assign({ id: d.id }, d.data() || {}));
      resolveNames().then(refreshShared);
    }, err => { clearTimeout(timer); dbState = 'error'; dbReady = false; boardErr = err && err.code || 'unavailable'; refreshShared(); });
  } catch (e) { clearTimeout(timer); dbState = 'off'; dbReady = false; refreshShared(); }
}
async function resolveNames() {
  if (!user || !board.length) return;
  try { const ps = await user.profiles(board.map(b => b.id)); names = ps || {}; } catch (e) {}
}
function refreshShared() {
  if (view === 'board') renderBoard();
  else if (G && G.phase === 'end' && view === 'play') { const y = window.scrollY; renderEnd(); window.scrollTo({ top: y }); }
}
async function publishScore() {
  if (!db || pub.state === 'saving') return;
  pub = { state: 'saving', msg: '' }; renderEnd();
  try {
    const uid = myId || (user ? await user.id() : null);
    if (!uid) throw { code: 'no_identity' };
    const f = E.finalScore(G);
    await db.doc('scores/' + uid).set({
      by: uid, equipe: (G.equipe || '').slice(0, 40), scen: G.scen, code: G.code.slice(0, 24),
      valeur: f.value, clients: f.clients, ca: Math.round(f.caTot), resultat: Math.round(f.resTot), survie: f.survived,
      premierBenefice: f.firstProfit || 0, statut: G.statut, at: Date.now()
    });
    pub = { state: 'done', msg: 'Votre score figure maintenant dans le classement.' };
  } catch (e) {
    const c = e && e.code || '';
    pub = { state: 'error', msg: /permission|not_granted|denied|forbidden|no_identity/.test(c)
      ? 'Votre accès à cette page ne permet pas d’écrire dans le classement. Copiez la fiche de résultat et envoyez-la à votre enseignant.'
      : 'La publication a échoué. Réessayez dans un instant ou envoyez la fiche de résultat à votre enseignant.' };
  }
  renderEnd();
}
function renderBoard() {
  if (localMode() || boardMode === 'fiches') return renderLocalBoard();
  const rows = board.filter(b => S[b.scen] && (boardFilter.scen === 'all' || b.scen === boardFilter.scen) && (!boardFilter.code || String(b.code || '').toUpperCase() === boardFilter.code.trim().toUpperCase()));
  const codes = [...new Set(board.map(b => b.code).filter(Boolean))].slice(0, 30);
  app.innerHTML = `
  <div class="topbar"><h2>Classement de la promotion</h2>${boardTabs()}</div>
  <div class="card pad" style="margin-bottom:14px">
    <div class="row" style="gap:16px">
      <div class="seg" role="group" aria-label="Projet">
        <button data-bf="all" aria-pressed="${boardFilter.scen === 'all'}">Tous les projets</button>
        ${Object.values(S).map(x => `<button data-bf="${x.id}" aria-pressed="${boardFilter.scen === x.id}">${x.name}</button>`).join('')}
      </div>
      <label class="row small" style="gap:8px">Code de partie <input class="text mono" id="bcode" list="codes" style="width:170px;min-height:38px" value="${esc(boardFilter.code)}" placeholder="tous"></label>
      <datalist id="codes">${codes.map(c => `<option value="${esc(c)}">`).join('')}</datalist>
    </div>
  </div>
  <div class="card">
    ${dbState === 'loading' ? `<div class="pad">${note('info', 'Chargement du classement…')}</div>` :
      dbState !== 'on' ? `<div class="pad">${note('info', dbState === 'error' ? 'Le classement n’a pas pu être chargé. Rechargez la page plus tard.' : 'Le classement partagé n’est disponible que lorsque la page est ouverte dans Claude par un membre de l’organisation. Vous pouvez jouer normalement et transmettre la fiche de résultat.')}</div>` :
      !rows.length ? `<div class="pad"><p class="muted">Aucun score publié${boardFilter.code || boardFilter.scen !== 'all' ? ' pour ce filtre' : ''} pour l’instant. Terminez une partie et cliquez sur « Publier au classement ».</p></div>` :
      `<div class="tblwrap"><table class="t lb"><thead><tr><th>Rang</th><th style="text-align:left">Équipe</th><th style="text-align:left">Projet</th><th>Code</th><th>Valeur fondateurs</th><th>Clients</th><th>CA cumulé</th><th>Issue</th></tr></thead><tbody>
      ${rows.map((b, i) => { const p = names[b.id]; return `<tr${b.id === myId ? ' style="font-weight:600"' : ''}><td class="rank">${i + 1}</td>
        <td style="text-align:left"><div class="who-cell">${p && p.avatarUrl ? `<img src="${esc(p.avatarUrl)}" alt="">` : ''}<span>${esc(b.equipe || 'Sans nom')}<br><span class="tiny">${esc((p && p.name) || 'Quelqu’un')}${b.id === myId ? ' · vous' : ''}</span></span></div></td>
        <td style="text-align:left">${S[b.scen].name}</td><td class="num">${esc(b.code)}</td><td class="num">${fmtN(b.valeur || 0)}</td><td class="num">${fmtN(b.clients || 0)}</td><td class="num">${fmtN(b.ca || 0)}</td>
        <td>${b.survie ? '<span class="chip good">En activité</span>' : '<span class="chip bad">Faillite</span>'}</td></tr>`; }).join('')}
      </tbody></table></div>`}
  </div>
  <p class="tiny" style="margin-top:10px">Pour comparer équitablement, filtrez par code de partie : les équipes d’un même code ont affronté le même marché.</p>`;
  bindBoardTabs();
  app.querySelectorAll('[data-bf]').forEach(b => b.onclick = () => { boardFilter.scen = b.dataset.bf; renderBoard(); });
  const bc = $('#bcode'); bc.onchange = e => { boardFilter.code = e.target.value; renderBoard(); };
}

/* ---------- règles ---------- */
function renderRules() {
  app.innerHTML = `
  <div class="topbar"><h2>Règles du jeu et dispositifs de financement</h2></div>
  <div class="rules">
    <div class="card pad"><h3>Objectif</h3><p>Créer la plus grande valeur possible pour les deux fondateurs à la fin du trimestre T12, sans jamais tomber en cessation de paiements. La valeur finale est le revenu récurrent annuel multiplié par un coefficient qui dépend du secteur et de la croissance de la dernière année, plus la trésorerie et les créances, moins les dettes, au prorata de la part détenue par les fondateurs.</p></div>
    <div class="card pad"><h3>Déroulement d’un trimestre</h3><ul>
      <li>Les réponses aux dossiers de financement déposés au trimestre précédent arrivent.</li>
      <li>Un événement peut survenir : sécheresse, concurrent, grand compte, panne… Certains imposent un choix.</li>
      <li>Vous fixez prix, marketing, entretiens, R&D, équipe et rémunération. La prévision se met à jour en direct.</li>
      <li>Vous validez : ventes, départs de clients, compte de résultat et trésorerie sont calculés.</li></ul></div>
    <div class="card pad"><h3>Comment se forment les ventes</h3><ul>
      <li>Les prospects dépendent de la notoriété (marketing et bouche-à-oreille), du prix comparé au prix jugé acceptable, de la qualité, de la saison et de l’intensité réelle du besoin, inconnue au départ.</li>
      <li>Les ventes sont limitées par la capacité commerciale (fondateurs et commerciaux) et, pour les boîtiers, par la capacité d’installation.</li>
      <li>Si les clients dépassent ce que votre équipe peut suivre, la qualité baisse et les départs augmentent.</li>
      <li>Les entretiens clients resserrent les fourchettes d’estimation (module II : validation du problème).</li></ul></div>
    <div class="card pad"><h3>Trésorerie et faillite</h3><ul>
      <li>Une partie des ventes est encaissée au trimestre suivant ; les grands comptes paient plus tard encore.</li>
      <li>Une trésorerie négative est financée par un découvert à 14 % par an.</li>
      <li>Deux trimestres consécutifs en trésorerie négative entraînent la cessation de paiements.</li></ul></div>
    <div class="card pad"><h3>Statuts juridiques</h3><ul>
      <li><b>Auto-entrepreneur</b> : 0,5 % du CA pour une activité commerciale ou industrielle, 1 % pour les services ; plafonds de 500 000 DH et 200 000 DH. Dépassement deux années consécutives : passage obligatoire en société.</li>
      <li><b>SARL</b> : 6 000 DH de création, frais de gestion, impôt sur les sociétés de 20 % du bénéfice annuel, avec une cotisation minimale de 0,25 % du CA. Seule une société peut ouvrir son capital à un investisseur.</li></ul></div>
    <div class="card pad"><h3>Dispositifs de financement</h3><ul>
      <li><b>Intelaka</b> : crédit bancaire à 2 %, garanti par Tamwilcom (ex-CCG), avec différé. La banque regarde votre validation terrain, votre prototype, vos ventes et votre apport.</li>
      <li><b>Start-TPE</b> : prêt à taux zéro de Tamwilcom accordé avec le crédit Intelaka (20 % du crédit, au plus 50 000 DH dans le jeu).</li>
      <li><b>Tech Start</b> (Innov Invest Fund) : subvention du prototypage pour les projets innovants accompagnés par une structure labellisée.</li>
      <li><b>Prêt d’honneur</b> : prêt personnel sans intérêt ni garantie, accordé après le prototype.</li>
      <li><b>Business angel</b> : apport en capital contre une part de l’entreprise ; une levée au plus par an.</li></ul></div>
  </div>
  <div style="margin-top:14px">${note('warn', '<b>Conditions simplifiées pour le jeu.</b> Les montants, taux, durées et probabilités d’acceptation sont des approximations pédagogiques. Les conditions réelles des dispositifs évoluent : vérifiez-les auprès de Tamwilcom, de votre banque, de Maroc PME et des structures d’accompagnement avant tout projet réel.')}</div>`;
}

/* ---------- démarrage ---------- */
render();
initShared();
let rsz; window.addEventListener('resize', () => { clearTimeout(rsz); rsz = setTimeout(() => { if ($('#dash') && dashTab === 'charts' && G && G.hist.length) bindDash(); }, 200); });

})();
</script>
