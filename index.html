<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="description" content="Start-up Sud : simulation d’entrepreneuriat en 12 trimestres pour les Bachelors SDSI et GEII, FEGG Guelmim, Université Ibn Zohr.">
<meta name="theme-color" content="#002147">
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 34 34'%3E%3Crect width='34' height='34' rx='8' fill='%23002147'/%3E%3Cpath d='M7 24 L13 17 L18 20 L27 10' fill='none' stroke='white' stroke-width='2.6' stroke-linecap='round' stroke-linejoin='round'/%3E%3C/svg%3E">
<title>Entrepreneuriat · Start-up Sud</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;500&family=IBM+Plex+Sans:ital,wght@0,400;0,500;0,600;1,400&family=Space+Grotesk:wght@500;600;700&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#F4F6FA; --surface:#FFFFFF; --surface-2:#EEF2F7; --line:#D5DDE8; --line-2:#B4C2D6;
  --ink:#1B2333; --ink-2:#4A5568; --ink-3:#6B7686;
  --navy:#002147; --navy-2:#3D5A80; --sky:#8FA7C7; --pale:#DCE4EF;
  --s1:#1C3F75; --s2:#6F9BD6; --grid:#E3E8F0;
  --band:#002147; --band-ink:#FFFFFF; --band-ink-2:#B9C8DD;
  --accent:#002147; --accent-ink:#FFFFFF; --accent-soft:#E4EBF5;
  --good:#1E7A4F; --good-bg:#E6F4EC; --warn:#9A5B00; --warn-bg:#FFF3DC; --bad:#B3261E; --bad-bg:#FCE8E6;
  --shadow:0 1px 2px rgba(0,33,71,.06),0 4px 14px rgba(0,33,71,.06);
  color-scheme:light;
}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){
  --bg:#0C1320; --surface:#131C2C; --surface-2:#1A2539; --line:#26334A; --line-2:#36486A;
  --ink:#E6ECF5; --ink-2:#A9B6CA; --ink-3:#8392A8;
  --navy:#9DB8DC; --navy-2:#7EA6E0; --sky:#3F6AA8; --pale:#22314A;
  --s1:#7EA6E0; --s2:#3F6AA8; --grid:#1F2B40;
  --band:#06101F; --band-ink:#F1F5FB; --band-ink-2:#9DB0CB;
  --accent:#9DB8DC; --accent-ink:#06101F; --accent-soft:#1D2B44;
  --good:#5CC492; --good-bg:#12291F; --warn:#E8B04A; --warn-bg:#2B2210; --bad:#F08A80; --bad-bg:#2E1616;
  --shadow:none; color-scheme:dark;
}}
:root[data-theme="dark"]{
  --bg:#0C1320; --surface:#131C2C; --surface-2:#1A2539; --line:#26334A; --line-2:#36486A;
  --ink:#E6ECF5; --ink-2:#A9B6CA; --ink-3:#8392A8;
  --navy:#9DB8DC; --navy-2:#7EA6E0; --sky:#3F6AA8; --pale:#22314A;
  --s1:#7EA6E0; --s2:#3F6AA8; --grid:#1F2B40;
  --band:#06101F; --band-ink:#F1F5FB; --band-ink-2:#9DB0CB;
  --accent:#9DB8DC; --accent-ink:#06101F; --accent-soft:#1D2B44;
  --good:#5CC492; --good-bg:#12291F; --warn:#E8B04A; --warn-bg:#2B2210; --bad:#F08A80; --bad-bg:#2E1616;
  --shadow:none; color-scheme:dark;
}
*{box-sizing:border-box}
html,body{margin:0}
body{background:var(--bg);color:var(--ink);font:15px/1.5 "IBM Plex Sans",system-ui,sans-serif;-webkit-font-smoothing:antialiased}
.wrap{max-width:1240px;margin:0 auto;padding-left:max(16px,env(safe-area-inset-left));padding-right:max(16px,env(safe-area-inset-right))}
h1,h2,h3,h4{font-family:"Space Grotesk",system-ui,sans-serif;margin:0;letter-spacing:-.01em;text-wrap:balance}
h2{font-size:22px;font-weight:600}
h3{font-size:16px;font-weight:600}
p{margin:0}
.num,.mono{font-family:"IBM Plex Mono",ui-monospace,monospace;font-variant-numeric:tabular-nums}
button{font:inherit;cursor:pointer}
input,select{font:inherit;color:inherit}
:focus-visible{outline:2px solid var(--navy-2);outline-offset:2px}

/* bandeau */
header.band{background:var(--band);color:var(--band-ink)}
.band .wrap{display:flex;align-items:center;gap:16px;min-height:64px;flex-wrap:wrap;padding-top:10px;padding-bottom:10px}
.brand{display:flex;align-items:center;gap:12px;margin-right:auto;min-width:0}
.brand svg{flex:none}
.brand b{font-family:"Space Grotesk";font-size:19px;font-weight:700;letter-spacing:-.01em;display:block;line-height:1.1}
.brand small{color:var(--band-ink-2);font-size:12.5px;display:block}
nav.tabs{display:flex;gap:4px}
nav.tabs button{background:transparent;border:0;color:var(--band-ink-2);padding:8px 12px;border-radius:8px;font-weight:500}
nav.tabs button[aria-current="page"]{background:rgba(255,255,255,.12);color:var(--band-ink)}
nav.tabs button:hover{color:var(--band-ink)}

main{padding:24px 0 64px}
.card{background:var(--surface);border:1px solid var(--line);border-radius:12px;box-shadow:var(--shadow)}
.pad{padding:20px}
.muted{color:var(--ink-2)}
.small{font-size:13px}
.tiny{font-size:12px;color:var(--ink-3)}
.row{display:flex;gap:12px;align-items:center;flex-wrap:wrap}
.stack>*+*{margin-top:12px}
.eyebrow{font-size:12px;text-transform:uppercase;letter-spacing:.08em;color:var(--ink-3);font-weight:600}

.btn{border:1px solid var(--line-2);background:var(--surface);color:var(--ink);padding:9px 14px;border-radius:8px;font-weight:500;display:inline-flex;align-items:center;gap:8px;min-height:40px}
.btn:hover{border-color:var(--navy-2)}
.btn.primary{background:var(--accent);color:var(--accent-ink);border-color:var(--accent)}
.btn.primary:hover{filter:brightness(1.12)}
.btn.big{padding:12px 20px;font-size:16px;min-height:48px}
.btn:disabled{opacity:.45;cursor:not-allowed;filter:none}
.btn.ghost{border-color:transparent;background:transparent;color:var(--navy-2)}
.btn.danger{border-color:var(--bad);color:var(--bad)}

.chip{display:inline-flex;align-items:center;gap:6px;font-size:12px;font-weight:600;padding:3px 9px;border-radius:999px;background:var(--surface-2);color:var(--ink-2);white-space:nowrap}
.chip.good{background:var(--good-bg);color:var(--good)}
.chip.warn{background:var(--warn-bg);color:var(--warn)}
.chip.bad{background:var(--bad-bg);color:var(--bad)}
.chip.info{background:var(--accent-soft);color:var(--navy-2)}

.note{display:flex;gap:10px;padding:12px 14px;border-radius:10px;background:var(--surface-2);font-size:14px;align-items:flex-start}
.note svg{flex:none;margin-top:2px}
.note.good{background:var(--good-bg)} .note.good svg{color:var(--good)}
.note.bad{background:var(--bad-bg)} .note.bad svg{color:var(--bad)}
.note.warn{background:var(--warn-bg)} .note.warn svg{color:var(--warn)}
.note.info svg{color:var(--navy-2)}

/* accueil */
.hero{display:grid;grid-template-columns:1.3fr 1fr;gap:28px;align-items:end;margin-bottom:24px}
.hero h1{font-size:clamp(28px,4vw,40px);font-weight:700;line-height:1.08;color:var(--navy)}
.hero p{color:var(--ink-2);max-width:60ch;margin-top:10px}
.facts{display:grid;grid-template-columns:repeat(3,1fr);gap:10px}
.fact{border-left:3px solid var(--navy-2);padding:2px 0 2px 12px}
.fact b{font-family:"Space Grotesk";font-size:22px;display:block;color:var(--navy)}
.fact span{font-size:12.5px;color:var(--ink-2)}
.scen-grid{display:grid;grid-template-columns:repeat(3,1fr);gap:14px}
.scen{position:relative;text-align:left;padding:18px;border:1.5px solid var(--line);border-radius:12px;background:var(--surface);color:var(--ink);display:flex;flex-direction:column;gap:10px}
.scen:hover{border-color:var(--sky)}
.scen[aria-pressed="true"]{border-color:var(--navy);box-shadow:0 0 0 3px var(--accent-soft)}
.scen h3{font-size:18px}
.scen .chip{align-self:flex-start}
.scen .kv{display:flex;gap:16px;font-size:12.5px;color:var(--ink-2);margin-top:auto;flex-wrap:wrap}
.scen .kv b{display:block;font-family:"IBM Plex Mono";font-size:13px;color:var(--ink);font-weight:500}
.scen .tick{position:absolute;top:14px;right:14px;width:22px;height:22px;border-radius:50%;border:1.5px solid var(--line-2);display:grid;place-items:center}
.scen[aria-pressed="true"] .tick{background:var(--navy);border-color:var(--navy);color:var(--accent-ink)}
.setup-grid{display:grid;grid-template-columns:1fr 1fr;gap:14px;margin-top:14px}
.field label,.field .lbl{display:block;font-weight:600;font-size:14px;margin-bottom:6px}
.field .help{font-size:12.5px;color:var(--ink-3);margin-top:6px}
.text{width:100%;border:1px solid var(--line-2);border-radius:8px;background:var(--surface);padding:9px 12px;min-height:42px}
.seg{display:inline-flex;border:1px solid var(--line-2);border-radius:9px;padding:3px;gap:3px;background:var(--surface-2);flex-wrap:wrap}
.seg button{border:0;background:transparent;padding:7px 12px;border-radius:6px;color:var(--ink-2);font-weight:500}
.seg button[aria-pressed="true"]{background:var(--surface);color:var(--ink);box-shadow:0 1px 2px rgba(0,0,0,.12)}
.check{display:flex;gap:10px;align-items:flex-start;cursor:pointer}
.check input{width:18px;height:18px;margin-top:2px;accent-color:var(--navy)}

/* curseurs */
.slider{display:grid;grid-template-columns:1fr auto;gap:2px 12px;align-items:center}
.slider .lbl{font-weight:500;font-size:14px}
.slider output{font-family:"IBM Plex Mono";font-size:14px;font-weight:500;text-align:right;white-space:nowrap}
.slider input[type=range]{grid-column:1/-1;width:100%;accent-color:var(--navy);margin:6px 0 0;height:28px}
.slider .help{grid-column:1/-1;font-size:12.5px;color:var(--ink-3)}

/* jeu */
.topbar{display:flex;gap:16px;align-items:center;flex-wrap:wrap;margin-bottom:16px}
.topbar h2{margin-right:auto}
.timeline{display:grid;grid-template-columns:repeat(12,1fr);gap:4px;margin-bottom:6px}
.timeline span{height:8px;border-radius:4px;background:var(--pale)}
.timeline span.done{background:var(--navy-2)}
.timeline span.now{background:var(--navy);outline:2px solid var(--accent-soft)}
.timeline span.fail{background:var(--bad)}
.years{display:grid;grid-template-columns:repeat(3,1fr);font-size:12px;color:var(--ink-3);margin-bottom:16px}
.kpis{display:grid;grid-template-columns:repeat(6,1fr);gap:10px;margin-bottom:18px}
.kpi{padding:12px 14px}
.kpi .k{font-size:12px;color:var(--ink-3);font-weight:500}
.kpi .v{font-family:"Space Grotesk";font-size:22px;font-weight:600;line-height:1.2;margin-top:2px;white-space:nowrap}
.kpi .d{font-size:12px;color:var(--ink-3);margin-top:2px}
.kpi .v.neg{color:var(--bad)}
.game{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1.05fr);gap:18px;align-items:start}
.panel-h{display:flex;align-items:center;gap:10px;padding:14px 18px;border-bottom:1px solid var(--line)}
.panel-h h3{margin-right:auto}
.sect{padding:16px 18px;border-bottom:1px solid var(--line)}
.sect:last-child{border-bottom:0}
.sect h4{font-size:14px;font-weight:600;margin-bottom:10px;display:flex;gap:8px;align-items:center;color:var(--navy)}
.sect h4 .n{font-family:"IBM Plex Mono";font-size:11px;color:var(--ink-3);font-weight:500}
.two{display:grid;grid-template-columns:1fr 1fr;gap:14px}
.est{background:var(--surface-2);border-radius:8px;padding:10px 12px;font-size:13px;margin-top:10px}
.est b{font-family:"IBM Plex Mono";font-weight:500}
.bar{height:6px;border-radius:3px;background:var(--pale);overflow:hidden;margin-top:6px}
.bar i{display:block;height:100%;background:var(--navy-2);border-radius:3px}
.stepper{display:flex;align-items:center;gap:10px;justify-content:space-between;padding:6px 0}
.stepper .ctl{display:flex;align-items:center;gap:6px}
.stepper button{width:36px;height:36px;border-radius:8px;border:1px solid var(--line-2);background:var(--surface);color:var(--ink);font-size:18px;line-height:1}
.stepper b{font-family:"IBM Plex Mono";min-width:24px;text-align:center;font-size:16px}
.stepper .who{font-size:14px;font-weight:500}
.stepper .who small{display:block;font-weight:400;color:var(--ink-3);font-size:12px}
.caps{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin-top:10px}
.caps div{background:var(--surface-2);border-radius:8px;padding:8px 10px;font-size:12px;color:var(--ink-2)}
.caps b{display:block;font-family:"IBM Plex Mono";font-size:14px;color:var(--ink);font-weight:500}
.caps .lim{outline:1.5px solid var(--warn);background:var(--warn-bg)}

.fin{display:grid;gap:10px}
.fi{border:1px solid var(--line);border-radius:10px;padding:12px 14px}
.fi-h{display:flex;gap:10px;align-items:flex-start}
.fi-h div{margin-right:auto}
.fi-h b{font-size:14.5px}
.fi-h small{display:block;font-size:12.5px;color:var(--ink-3)}
.fi .why{font-size:12.5px;color:var(--ink-2);margin-top:6px}
.fi .act{display:flex;gap:10px;align-items:center;margin-top:10px;flex-wrap:wrap}
.fi .act .slider{flex:1;min-width:200px}
.fi select{border:1px solid var(--line-2);border-radius:8px;background:var(--surface);padding:7px 10px;min-height:40px}

.side{display:grid;gap:18px;align-content:start;grid-template-columns:minmax(0,1fr);min-width:0}
.fc-card{z-index:3}
.forecast{background:var(--accent-soft);border-radius:10px;padding:14px 16px;margin:16px 18px}
@media (min-width:1021px){.fc-card{position:sticky;top:12px;box-shadow:0 6px 24px rgba(0,33,71,.12)}}
.forecast .g{display:grid;grid-template-columns:repeat(4,1fr);gap:10px;margin-top:8px}
.forecast .g div{font-size:12px;color:var(--ink-2)}
.forecast .g b{display:block;font-family:"IBM Plex Mono";font-size:15px;color:var(--ink);font-weight:500}
.go{padding:0 18px 18px;display:flex;gap:12px;align-items:center;flex-wrap:wrap}

.event{border:1.5px solid var(--navy-2);border-radius:12px;background:var(--surface);overflow:hidden;margin-bottom:18px}
.event .eh{background:var(--accent-soft);padding:14px 18px;display:flex;gap:12px;align-items:center}
.event .eh h3{font-size:18px}
.event .eb{padding:14px 18px}
.choices{display:grid;gap:10px;margin-top:12px}
.choice{text-align:left;border:1px solid var(--line-2);border-radius:10px;padding:12px 14px;background:var(--surface);color:var(--ink)}
.choice:hover{border-color:var(--navy);background:var(--accent-soft)}
.choice b{display:block}
.choice span{font-size:13px;color:var(--ink-2)}

.charts{display:grid;gap:14px}
.chart{position:relative}
.chart svg{display:block;width:100%;height:auto;overflow:visible}
.chart .legend{display:flex;gap:14px;font-size:12.5px;color:var(--ink-2);margin:2px 0 6px;flex-wrap:wrap}
.chart .legend i{display:inline-block;width:10px;height:10px;border-radius:2px;margin-right:6px;vertical-align:-1px}
.tip{position:absolute;pointer-events:none;background:var(--surface);border:1px solid var(--line-2);border-radius:8px;padding:8px 10px;font-size:12.5px;box-shadow:0 4px 14px rgba(0,0,0,.14);min-width:150px;z-index:5;display:none}
.tip b{font-family:"Space Grotesk"}
.tip div{display:flex;justify-content:space-between;gap:12px}
.tip .num{font-size:12px}
.tabs2{display:flex;gap:4px;padding:10px 18px 0;border-bottom:1px solid var(--line);overflow-x:auto}
.tabs2 button{border:0;background:transparent;padding:8px 10px 10px;color:var(--ink-2);font-weight:500;border-bottom:2px solid transparent;white-space:nowrap}
.tabs2 button[aria-selected="true"]{color:var(--navy);border-bottom-color:var(--navy)}
.tblwrap{overflow-x:auto}
table.t{border-collapse:collapse;width:100%;font-size:13px}
table.t th,table.t td{padding:7px 10px;text-align:right;white-space:nowrap;border-bottom:1px solid var(--line)}
table.t th:first-child,table.t td:first-child{text-align:left;position:sticky;left:0;background:var(--surface)}
table.t thead th{background:var(--navy);color:#fff;font-weight:600;font-size:12.5px}
:root[data-theme="dark"] table.t thead th{color:var(--accent-ink)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]) table.t thead th{color:var(--accent-ink)}}
table.t thead th:first-child{background:var(--navy)}
table.t tbody tr:nth-child(even) td{background:var(--surface-2)}
table.t td.num{font-family:"IBM Plex Mono"}
table.t tr.tot td{font-weight:600;border-top:1.5px solid var(--line-2)}
.neg{color:var(--bad)}
.ind{display:grid;grid-template-columns:repeat(2,1fr);gap:10px}
.ind div{background:var(--surface-2);border-radius:10px;padding:12px}
.ind b{display:block;font-family:"Space Grotesk";font-size:20px}
.ind span{font-size:12.5px;color:var(--ink-2)}
.journal{list-style:none;margin:0;padding:0;max-height:420px;overflow:auto}
.journal li{display:grid;grid-template-columns:42px 1fr;gap:8px;padding:8px 0;border-bottom:1px solid var(--line);font-size:13.5px}
.journal li .tq{font-family:"IBM Plex Mono";font-size:12px;color:var(--ink-3);padding-top:2px}
.journal li.bad{color:var(--bad)}
.journal li.good span{color:var(--good)}

.report-g{display:grid;grid-template-columns:repeat(4,1fr);gap:10px;margin:12px 0}
.report-g div{background:var(--surface-2);border-radius:10px;padding:10px 12px}
.report-g b{display:block;font-family:"Space Grotesk";font-size:20px}
.report-g span{font-size:12px;color:var(--ink-2)}

/* fin */
.end-hero{display:grid;grid-template-columns:1.1fr 1fr;gap:18px}
.score{padding:24px;background:var(--band);color:var(--band-ink);border-radius:14px}
.score .eyebrow{color:var(--band-ink-2)}
.score .big{font-family:"Space Grotesk";font-size:clamp(34px,5vw,52px);font-weight:700;line-height:1.05;margin:6px 0}
.score .sub{color:var(--band-ink-2);font-size:14px}
.score .g{display:grid;grid-template-columns:repeat(3,1fr);gap:12px;margin-top:20px}
.score .g b{display:block;font-family:"IBM Plex Mono";font-size:16px;font-weight:500;color:var(--band-ink)}
.score .g span{font-size:12px;color:var(--band-ink-2)}
.deb{list-style:none;padding:0;margin:0;display:grid;gap:8px}
textarea.fiche{width:100%;min-height:170px;font:13px/1.5 "IBM Plex Mono",monospace;border:1px solid var(--line-2);border-radius:8px;padding:10px;background:var(--surface-2);color:var(--ink);resize:vertical}

/* classement */
.lb td.rank{font-family:"Space Grotesk";font-weight:700;color:var(--navy)}
.who-cell{display:flex;align-items:center;gap:8px}
.who-cell img{width:22px;height:22px;border-radius:50%}
.rules{display:grid;grid-template-columns:repeat(2,1fr);gap:14px}
.rules .card h3{margin-bottom:8px;color:var(--navy)}
.rules ul{margin:6px 0 0;padding-left:18px}
.rules li{margin:4px 0}
.hidden{display:none!important}
.sr{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0)}

@media (max-width:1020px){
  .game{grid-template-columns:minmax(0,1fr)}
  .kpis{grid-template-columns:repeat(3,1fr)}
}
@media (max-width:760px){
  .hero,.end-hero,.setup-grid,.rules{grid-template-columns:1fr}
  .scen-grid{grid-template-columns:1fr}
  .two{grid-template-columns:1fr}
  .kpis{grid-template-columns:repeat(2,1fr)}
  .forecast .g,.report-g{grid-template-columns:repeat(2,1fr)}
  .caps{grid-template-columns:1fr 1fr 1fr}
  .band .wrap{gap:8px}
  nav.tabs{width:100%;overflow-x:auto}
  .brand small{display:none}
  .score .g{grid-template-columns:repeat(2,1fr)}
}
@media (prefers-reduced-motion:no-preference){
  .btn,.scen,.choice{transition:border-color .15s,background-color .15s,filter .15s}
}
</style>
<script>window.__STANDALONE__ = true;</script>
</head>
<body>
<header class="band">
  <div class="wrap">
    <div class="brand">
      <svg width="34" height="34" viewBox="0 0 34 34" aria-hidden="true"><rect width="34" height="34" rx="8" fill="#FFFFFF" fill-opacity=".1"/><path d="M7 24 L13 17 L18 20 L27 10" fill="none" stroke="#FFFFFF" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"/><circle cx="27" cy="10" r="2.6" fill="#8FA7C7"/></svg>
      <div><b>Start-up Sud</b><small>Simulation d’entrepreneuriat · FEGG Guelmim · Université Ibn Zohr</small></div>
    </div>
    <nav class="tabs" aria-label="Sections">
      <button data-nav="play" aria-current="page">Jouer</button>
      <button data-nav="board">Classement</button>

function hashStr(s) { let h = 1779033703 ^ s.length; for (let i = 0; i < s.length; i++) { h = Math.imul(h ^ s.charCodeAt(i), 3432918353); h = h << 13 | h >>> 19; } return h >>> 0; }

function gauss(r) { let u = 0; for (let i = 0; i < 6; i++) u += r(); return (u - 3) / Math.sqrt(0.5); }

function drawEvent(s) {
  if (s.t < 2) return null;
  const r = rngFor(s.code, s.t, 'ev');
  if (r() > 0.7) return null;
  const pool = EVENTS.filter(e => e.scen.includes(s.scen) && !s.fired.includes(e.id) && (!e.cond || e.cond(s)));
  if (!pool.length) return null;
  const tot = pool.reduce((a, e) => a + (e.weight || 1), 0);
  let x = r() * tot;
  for (const e of pool) { x -= (e.weight || 1); if (x <= 0) return e.id; }
  return pool[pool.length - 1].id;
}

function startQuarter(s) {
  s.eventCost = 0; s.finThisQ = 0; s.notes = []; s.eventNote = null; s.deal = null; s.delayExtra = 0;
  resolveApps(s);
  const ev = drawEvent(s);
  s.event = ev; s.phase = 'decide';
  if (ev) {
    const e = EVENTS.find(x => x.id === ev);
    s.fired.push(ev);
    if (e.auto) { e.auto(s); s.log.push({ t: s.t, k: 'event', x: e.title + ' : ' + e.text }); s.eventDone = true; }
    else { s.phase = 'event'; s.eventDone = false; }
  }
}

function chooseEvent(s, idx) {
  const e = EVENTS.find(x => x.id === s.event);
  if (!e || !e.choices) return;
  const c = e.choices[idx];
  c.apply(s, rngFor(s.code, s.t, 'evc'));
  s.log.push({ t: s.t, k: 'event', x: `${e.title} : « ${c.label} ».` + (s.eventNote ? ' ' + s.eventNote : '') });
  s.eventChoice = idx; s.eventDone = true; s.phase = 'decide';
}

/* ---------- Financement ---------- */
function intelakaProb(s, amount) {
  const last = s.hist[s.hist.length - 1];
  let p = 0.35;
  if (s.interviews >= 20) p += 0.2;
  if (s.mvp) p += 0.15;
  if (last && last.CA > 0) p += 0.1;
  if (s.apport >= 0.2 * amount) p += 0.1;
  return clamp(p, 0.1, 0.9);
}
function techStartProb(s) { return clamp(0.5 + (s.interviews >= 10 ? 0.2 : 0) + (s.quality >= 40 ? 0.1 : 0), 0.1, 0.9); }
function honneurProb(s) { return clamp(0.55 + (s.clients >= 10 ? 0.15 : 0) + (s.interviews >= 20 ? 0.1 : 0), 0.1, 0.9); }
function angelPreMoney(s) {
  const sc = SCEN[s.scen];
  const arr = s.clients * s.dec.sub * 12;
  return Math.max(250000, Math.round((arr * sc.valMult * 0.8 + (s.mvp ? 150000 : 0) + s.quality * 2000) / 50000) * 50000);
}
function debtLeft(s) { return s.loans.reduce((a, l) => a + l.remaining, 0); }

function eligibility(s) {
  const sc = SCEN[s.scen], t = s.t, pending = type => s.apps.some(a => a.type === type);
  const out = {};
  out.apport = s.savings > 0 ? { ok: true } : { ok: false, why: 'L’épargne des associés est épuisée.' };
  out.incub = s.incub ? { done: true, why: 'Vous êtes hébergés à l’incubateur.' } : { ok: true };
  out.sarl = s.statut === 'SARL' ? { done: true, why: 'Votre entreprise est une SARL.' } : { ok: true };
  if (s.used.intelaka) out.intelaka = { done: true, why: 'Crédit Intelaka accordé.' };
  else if (pending('intelaka')) out.intelaka = { pending: true, why: 'Dossier en cours d’instruction par la banque.' };
  else if ((s.refused.intelaka || 0) > t) out.intelaka = { ok: false, why: `Refus récent : nouvelle demande possible au trimestre T${s.refused.intelaka}.` };
  else out.intelaka = { ok: true };
  if (!sc.innov) out.techStart = { ok: false, why: 'Réservé aux projets innovants accompagnés par une structure labellisée.' };
  else if (s.techStart) out.techStart = { done: true, why: s.techStart.cap > s.techStart.used && !s.mvp ? `Subvention accordée : ${fmt(s.techStart.cap - s.techStart.used)} encore disponibles.` : 'Subvention accordée.' };
  else if (pending('techStart')) out.techStart = { pending: true, why: 'Dossier en cours d’examen par le comité.' };
  else if (s.mvp) out.techStart = { ok: false, why: 'La subvention finance le prototypage : votre prototype est déjà prêt.' };
  else if (!s.incub) out.techStart = { ok: false, why: 'Il faut d’abord être accompagné par l’incubateur.' };
  else if ((s.refused.techStart || 0) > t) out.techStart = { ok: false, why: `Refus récent : nouvelle demande possible en T${s.refused.techStart}.` };
  else out.techStart = { ok: true };
  if (s.used.honneur) out.honneur = { done: true, why: 'Prêt d’honneur accordé.' };
  else if (pending('honneur')) out.honneur = { pending: true, why: 'Dossier en cours d’examen.' };
  else if (!s.incub) out.honneur = { ok: false, why: 'Il faut être accompagné par l’incubateur.' };
  else if (!s.mvp) out.honneur = { ok: false, why: 'Accordé après la réalisation du prototype ou de l’offre.' };
  else if ((s.refused.honneur || 0) > t) out.honneur = { ok: false, why: `Refus récent : nouvelle demande possible en T${s.refused.honneur}.` };
  else out.honneur = { ok: true };
  if (s.statut !== 'SARL') out.angel = { ok: false, why: 'Un investisseur entre au capital d’une société : passez en SARL.' };
  else if (s.clients < 15) out.angel = { ok: false, why: `Il faut au moins 15 clients actifs pour intéresser un investisseur (vous en avez ${s.clients}).` };
  else if (s.angel && s.angel.t > t - 4) out.angel = { ok: false, why: 'Une seule levée de fonds par an.' };
  else out.angel = { ok: true };
  return out;
}

function actApport(s, amt) {
  amt = clamp(Math.round(amt), 0, s.savings); if (!amt) return;
  s.savings -= amt; s.apport += amt; s.cash += amt; s.finThisQ += amt;
  s.log.push({ t: s.t, k: 'fin', x: `Apport complémentaire des associés : ${fmt(amt)}.` });
}
function actIncub(s) { if (s.incub) return; s.incub = true; s.log.push({ t: s.t, k: 'fin', x: 'Entrée à l’incubateur : loyer réduit et accès aux dispositifs Innov Invest.' }); }
function actSARL(s) {
  if (s.statut === 'SARL') return; s.statut = 'SARL'; s.cash -= SARL_FEES; s.eventCost += 0;
  s.sarlCost = (s.sarlCost || 0) + SARL_FEES;
  s.log.push({ t: s.t, k: 'fin', x: 'Passage en SARL : 6 000 DH de frais de constitution.' });
}
function actIntelaka(s, amount) {
  amount = clamp(Math.round(amount / 10000) * 10000, 50000, 500000);
  s.apps.push({ type: 'intelaka', amount, p: intelakaProb(s, amount), at: s.t + 1 });
  s.log.push({ t: s.t, k: 'fin', x: `Demande de crédit Intelaka de ${fmt(amount)} déposée auprès de la banque. Réponse au prochain trimestre.` });
}
function actTechStart(s) {
  s.apps.push({ type: 'techStart', p: techStartProb(s), at: s.t + 1 });
  s.log.push({ t: s.t, k: 'fin', x: 'Dossier Tech Start déposé via l’incubateur. Réponse au prochain trimestre.' });
}
function actHonneur(s, amount) {
  amount = clamp(Math.round(amount / 10000) * 10000, 50000, 300000);
  s.apps.push({ type: 'honneur', amount, p: honneurProb(s), at: s.t + 1 });
  s.log.push({ t: s.t, k: 'fin', x: `Demande de prêt d’honneur de ${fmt(amount)} déposée. Réponse au prochain trimestre.` });
}
function actAngel(s, invest) {
  const pre = angelPreMoney(s);
  invest = clamp(Math.round(invest / 50000) * 50000, 100000, 800000);
  const share = invest / (pre + invest);
  s.founderShare *= (1 - share); s.cash += invest; s.finThisQ += invest;
  s.angel = { t: s.t, pre, invest, share };
  addMod(s, 'aware', { add: 0.05 }, s.t, s.t);
  s.log.push({ t: s.t, k: 'fin', x: `Levée de fonds : ${fmt(invest)} pour ${(share * 100).toFixed(1).replace('.', ',')} % du capital (valorisation avant levée ${fmt(pre)}).` });
}

function resolveApps(s) {
  const keep = [];
  for (const a of s.apps) {
    if (a.at > s.t) { keep.push(a); continue; }
    const ok = rngFor(s.code, s.t, 'app:' + a.type)() < a.p;
    if (a.type === 'intelaka') {
      if (ok) {
        s.loans.push({ name: 'Crédit Intelaka', amount: a.amount, remaining: a.amount, rate: 0.02, defer: 4, term: 20, start: s.t });
        const tpe = Math.min(50000, Math.round(a.amount * 0.2));
        s.loans.push({ name: 'Prêt Start-TPE', amount: tpe, remaining: tpe, rate: 0, defer: 4, term: 20, start: s.t });
        s.cash += a.amount + tpe; s.finThisQ += a.amount + tpe; s.used.intelaka = true;
        s.notes.push({ k: 'good', x: `Crédit Intelaka accordé : ${fmt(a.amount)} à 2 %, garanti à 80 % par Tamwilcom, plus un prêt Start-TPE à 0 % de ${fmt(tpe)}.` });
      } else { s.refused.intelaka = s.t + 2; s.notes.push({ k: 'bad', x: 'Crédit Intelaka refusé par la banque. Renforcez votre dossier (entretiens clients, prototype, premières ventes) avant de redemander.' }); }
    }
    if (a.type === 'techStart') {
      if (ok) { s.techStart = { cap: 200000, used: 0, t: s.t }; s.notes.push({ k: 'good', x: 'Subvention Tech Start accordée : 80 % de vos dépenses de R&D remboursées jusqu’au prototype, dans la limite de 200 000 DH.' }); }
      else { s.refused.techStart = s.t + 2; s.notes.push({ k: 'bad', x: 'Tech Start refusée : le comité demande davantage de validation auprès des clients.' }); }
    }
    if (a.type === 'honneur') {
      if (ok) {
        s.loans.push({ name: 'Prêt d’honneur', amount: a.amount, remaining: a.amount, rate: 0, defer: 8, term: 24, start: s.t });
        s.cash += a.amount; s.finThisQ += a.amount; s.used.honneur = true;
        s.notes.push({ k: 'good', x: `Prêt d’honneur accordé : ${fmt(a.amount)}, sans intérêt ni garantie, remboursable après deux ans.` });
      } else { s.refused.honneur = s.t + 2; s.notes.push({ k: 'bad', x: 'Prêt d’honneur refusé : le comité attend plus de clients.' }); }
    }
    s.log.push({ t: s.t, k: ok ? 'good' : 'bad', x: s.notes[s.notes.length - 1].x });

}

/* ---------- Estimations issues des entretiens ---------- */
function estimates(s) {
  const sc = SCEN[s.scen], tr = truth(s.code), n = s.interviews;
  const sd = 0.32 / Math.sqrt(1 + n / 6);
  const dmC = tr.dm * (1 + tr.z1 * sd * 0.5);
  const ref = sc.refAnnual * tr.refMult * modMul(s, s.t, 'ref');
  const refC = ref * (1 + tr.z2 * sd * 0.5);
  return { n, precision: clamp(1 - sd / 0.32, 0, 1), dmLo: Math.max(0.3, dmC - sd), dmHi: dmC + sd, refLo: refC * (1 - sd), refHi: refC * (1 + sd) };
}

/* ---------- Simulation d’un trimestre ---------- */
function simulate(s0, det) {
  const s = clone(s0), sc = SCEN[s.scen], d = s.dec, t = s.t, tr = truth(s.code);
  const r = det ? () => 0.5 : rngFor(s.code, t, 'q');
  const qi = (t - 1) % 4, season = sc.season[qi];
  const R = { t };

  // équipe
  const hireN = Math.max(0, d.sales - s.staff.sales) + Math.max(0, d.tech - s.staff.tech);
  const fireCost = sc.salesSalary * Math.max(0, s.staff.sales - d.sales) + sc.techSalary * Math.max(0, s.staff.tech - d.tech);
  R.hire = hireN * HIRE + fireCost;
  s.staff = { sales: d.sales, tech: d.tech };

  // entretiens et qualité
  const mvpBefore = s.mvp;
  s.interviews += d.interviews;
  if (!mvpBefore) s.intvBeforeMvp += d.interviews;
  s.quality += 28 * (1 - Math.exp(-d.rd / 40000)) - 1.5 + Math.min(4, d.interviews * (mvpBefore ? 0.05 : 0.15));
  s.rdCum += d.rd;
  let mvpNow = false;
  if (!s.mvp && s.rdCum >= sc.protoCost) { s.mvp = true; mvpNow = true; }

  // notoriété
  s.A = s.A * 0.97 + (1 - s.A) * (0.5 * (1 - Math.exp(-d.mkt / sc.mktScale)) + 0.02 + 0.25 * (s.clients / sc.market) * (s.quality / 60)) + modAdd(s, t, 'aware');
  s.A = clamp(s.A, 0, 0.95);

  // demande
  const market = sc.market * modMul(s, t, 'market');
  const annual = (sc.hasUnit ? d.unit : 0) + 12 * d.sub;
  const ref = sc.refAnnual * tr.refMult * modMul(s, t, 'ref');
  const attract = clamp(Math.pow(ref / annual, sc.elast), 0.08, 2.5);
  const qF = 0.5 + clamp(s.quality, 15, 95) / 100;
  const noise = det ? 1 : 0.8 + 0.4 * r();
  const leads = Math.max(0, market - s.clients) * s.A * sc.conv * attract * qF * tr.dm * season * modMul(s, t, 'demand') * noise;
  const intvLoad = sc.founderCap * s.founderCapMul * Math.min(0.5, d.interviews / 50);
  const salesCap = Math.max(0, sc.founderCap * s.founderCapMul - intvLoad) + d.sales * sc.salesCap + (s.partner ? 15 : 0);
  const instCap = (d.tech + 1) * sc.installCap;
  const canSell = s.mvp;
  let newC = canSell ? Math.floor(Math.min(leads, salesCap, instCap) * (mvpNow ? 0.5 : 1)) : 0;
  let dealC = 0;
  if (s.deal && canSell) { dealC = Math.max(0, Math.min(s.deal.clients, Math.floor(instCap - newC))); }
  const serveCap = (d.tech + 1) * sc.serveCap;
  let churn = sc.baseChurn * (1.6 - clamp(s.quality, 15, 95) / 100) + modAdd(s, t, 'churn');
  const load = (s.clients + newC + dealC) / serveCap;
  if (load > 1) { churn += 0.2 * (load - 1); s.quality -= Math.min(10, 6 * (load - 1)); }
  churn = clamp(churn, 0.005, 0.6);
  const lost = det ? s.clients * churn : Math.round(s.clients * churn * (0.8 + 0.4 * r()));
  const gained = newC + dealC;
  const avg = s.clients + gained / 2 - lost / 2;
  s.clients = Math.max(0, s.clients + gained - lost);
  if (!det) s.clients = Math.round(s.clients);
  s.quality = clamp(s.quality, 15, 95);

  // chiffre d’affaires
  const partnerShare = s.partner ? Math.min(newC, 15) : 0;
  R.unitRev = sc.hasUnit ? newC * d.unit : 0;
  R.dealRev = (sc.hasUnit && dealC) ? dealC * d.unit * (1 - s.deal.disc) : 0;
  R.subRev = avg * d.sub * 3;
  R.CA = R.unitRev + R.dealRev + R.subRev;
  const unitCost = sc.hasUnit ? sc.unit.cost * modMul(s, t, 'unitCost') : 0;
  R.cogs = (newC + dealC) * unitCost + avg * sc.sub.cost * modMul(s, t, 'subCost') * 3;
  R.commission = partnerShare * d.unit * 0.12 + R.subRev * (s.commission || 0);
  R.marge = R.CA - R.cogs - R.commission;

  // charges
  R.salaries = d.sales * sc.salesSalary * 3 + d.tech * sc.techSalary * 3 + s.extraFixed;
  R.founders = d.pay * 2 * 3;
  R.mkt = d.mkt;
  let subsidy = 0;
  if (s.techStart && !mvpBefore) { subsidy = Math.min(0.8 * d.rd, s.techStart.cap - s.techStart.used); s.techStart.used += subsidy; }
  R.rd = d.rd; R.subsidy = subsidy;
  R.rent = (s.incub ? RENT_INC : RENT) + OTHER + (s.statut === 'SARL' ? 3000 : 0);
  R.intv = d.interviews * 80;
  R.eventCost = s.eventCost;
  R.sarl = s.sarlCost || 0; s.sarlCost = 0;
  // emprunts
  let interest = 0, principal = 0;
  for (const l of s.loans) {
    const k = t - l.start;
    interest += l.remaining * l.rate / 4;
    if (k >= l.defer && l.remaining > 0) { const p = Math.min(l.remaining, l.amount / (l.term - l.defer)); principal += p; l.remaining -= p; }
  }
  R.interest = interest + (s.cash < 0 ? -s.cash * OVERDRAFT / 4 : 0);
  R.principal = principal;

  // impôts
  const preTax = R.marge - R.salaries - R.founders - R.mkt - (R.rd - subsidy) - R.rent - R.intv - R.hire - R.eventCost - R.interest - R.sarl;
  s.yearCA += R.CA; s.yearProfit += preTax;
  R.tax = 0;

  R.result = preTax - R.tax;

  // encaissements
  const fromRec = s.receivables * (1 - s.delayExtra);
  const carried = s.receivables * s.delayExtra;
  let fut = 0; s.future = s.future.filter(f => { if (f.t <= t) { fut += f.amount; return false; } return true; });

  R.collected = normalCA * (1 - sc.delay) + fromRec + fut;
  s.receivables = normalCA * sc.delay + carried;
  R.cashOut = R.cogs + R.commission + R.salaries + R.founders + R.mkt + (R.rd - subsidy) + R.rent + R.intv + R.hire + R.eventCost + R.interest + R.principal + R.tax + R.sarl;
  R.fin = s.finThisQ;
  R.cashStart = s0.cash - s.finThisQ + (s0.sarlCost || 0);

  // AE : plafond annuel

      else s.aeOver = 0;
      if (s.aeOver >= 2) { s.statut = 'SARL'; s.sarlCost = SARL_FEES; s.cash -= SARL_FEES; s.log.push({ t, k: 'bad', x: 'Deux années consécutives au-dessus du plafond : radiation du statut d’auto-entrepreneur et passage obligatoire en SARL.' }); }
    }
    s.yearCA = 0; s.yearProfit = 0;
  }

  // fondateurs non rémunérés
  s.unpaidQ = d.pay === 0 ? s.unpaidQ + 1 : 0; s.maxUnpaid = Math.max(s.maxUnpaid, s.unpaidQ);

  Object.assign(R, {
    newC, dealC, lost, clients: s.clients, leads, salesCap, instCap: sc.installCap >= 999 ? null : instCap, serveCap, churn, quality: s.quality, A: s.A,
    attract, cash: s.cash, debt: debtLeft(s), mvpNow, receivables: s.receivables + s.future.reduce((a, f) => a + f.amount, 0),
    coca: gained > 0 ? (R.mkt + d.sales * sc.salesSalary * 3) / gained : null,
    ltv: churn > 0 ? ((d.sub - sc.sub.cost) * 3 / churn + (sc.hasUnit ? d.unit - unitCost : 0)) : null,
    founderShare: s.founderShare, staff: { ...s.staff },
    dec: { unit: d.unit, sub: d.sub, mkt: d.mkt, rd: d.rd, interviews: d.interviews, pay: d.pay, sales: d.sales, tech: d.tech }
  });

}

function endQuarter(s0) {
  const { s, R } = simulate(s0, false);
  s.hist.push(R);
  if (R.mvpNow) s.log.push({ t: s.t, k: 'good', x: `${SCEN[s.scen].mvpLabel} terminé : vous pouvez commencer à vendre.` });
  s.log.push({ t: s.t, k: R.result >= 0 ? 'good' : 'info', x: `Bilan T${s.t} : ${R.newC + R.dealC} nouveaux clients, ${Math.round(R.lost)} départs, CA ${fmt(R.CA)}, résultat ${fmt(R.result)}, trésorerie ${fmt(R.cash)}.` });
  if (s.cash < 0) {
    s.alertQ += 1;
    if (s.alertQ >= 2) { s.failed = true; s.phase = 'end'; s.log.push({ t: s.t, k: 'bad', x: 'Deuxième trimestre consécutif en trésorerie négative : cessation de paiements.' }); return s; }
    s.log.push({ t: s.t, k: 'bad', x: 'Trésorerie négative : la banque tolère un découvert à 14 % pendant un trimestre. Rétablissez-la avant la fin du prochain trimestre.' });
  } else s.alertQ = 0;
  s.phase = s.t >= 12 ? 'end' : 'report';
  return s;
}

function nextQuarter(s) { s.t += 1; startQuarter(s); return s; }

function finalScore(s) {
  const sc = SCEN[s.scen], h = s.hist;
  const arr = s.clients * s.dec.sub * 12;
  const c8 = h[7] ? h[7].clients : (h[h.length - 5] ? h[h.length - 5].clients : 0);
  const growth = s.clients / Math.max(1, c8);
  const mult = sc.valMult * clamp(0.6 + 0.4 * growth, 0.6, 1.8);
  const value = s.failed ? 0 : Math.max(0, arr * mult + s.cash + s.receivables + s.future.reduce((a, f) => a + f.amount, 0) - debtLeft(s));
  const caTot = h.reduce((a, q) => a + q.CA, 0);
  const resTot = h.reduce((a, q) => a + q.result, 0);
  const firstProfit = h.find(q => q.result > 0);
  return {
    value: Math.round(value * s.founderShare), firmValue: Math.round(value), arr, mult, caTot, resTot, clients: s.clients,
    jobs: s.staff.sales + s.staff.tech + 2, survived: !s.failed, quarters: h.length,
    firstProfit: firstProfit ? firstProfit.t : null, founderShare: s.founderShare, minCash: Math.min(...h.map(q => q.cash))
  };
}

function debrief(s) {
  const sc = SCEN[s.scen], h = s.hist, f = finalScore(s), out = [];
  if (s.failed) out.push({ k: 'bad', x: `Cessation de paiements au trimestre T${h.length}. Surveillez la prévision de trésorerie et sécurisez les financements un trimestre à l’avance : les dossiers bancaires prennent du temps (module V).` });
  else out.push({ k: 'good', x: `Votre entreprise a survécu trois ans avec ${f.clients} ${sc.client} clientes et ${f.jobs} emplois, fondateurs compris.` });
  if (sc.protoCost) {
    if (s.intvBeforeMvp >= 20) out.push({ k: 'good', x: `Vous avez mené ${s.intvBeforeMvp} entretiens avant de finir le prototype : vos estimations de prix et de demande étaient fondées sur le terrain (module II).` });
    else out.push({ k: 'bad', x: `Seulement ${s.intvBeforeMvp} entretiens avant le prototype. Vous avez construit le produit sur des hypothèses peu vérifiées : le biais de confirmation guette (module I, chapitre 3).` });
  } else if (s.interviews >= 20) out.push({ k: 'good', x: `${s.interviews} entretiens menés : vous connaissiez votre marché.` });
  else out.push({ k: 'bad', x: `Seulement ${s.interviews} entretiens sur trois ans : votre fourchette de prix acceptable est restée large.` });
  if (f.firstProfit) out.push({ k: 'good', x: `Premier trimestre bénéficiaire : T${f.firstProfit}. Résultat cumulé sur la partie : ${fmt(f.resTot)}.` });
  else out.push({ k: 'bad', x: `Aucun trimestre bénéficiaire. Calculez votre seuil de rentabilité : combien de clients actifs couvrent vos charges fixes (fiche F5) ?` });
  const last = h.slice(-4).filter(q => q.coca && q.ltv);
  if (last.length) {
    const ratio = last.reduce((a, q) => a + q.ltv / q.coca, 0) / last.length;
    out.push({ k: ratio >= 3 ? 'good' : 'bad', x: `Ratio valeur vie client / coût d’acquisition sur la dernière année : ${ratio.toFixed(1).replace('.', ',')}. ${ratio >= 3 ? 'Au-dessus de 3 : chaque client rapporte bien plus qu’il ne coûte à conquérir.' : 'En dessous de 3 : vos clients coûtent trop cher à acquérir ou partent trop vite.'}` });
  }
  const highChurn = h.filter(q => q.churn > 0.1).length;
  if (highChurn >= 2) out.push({ k: 'bad', x: `Taux de départ supérieur à 10 % pendant ${highChurn} trimestres : recruter des techniciens ou investir en R&D aurait protégé votre base de clients.` });
  if (f.founderShare < 0.999) out.push({ k: f.founderShare >= 0.6 ? 'info' : 'bad', x: `Les fondateurs détiennent ${(f.founderShare * 100).toFixed(0)} % du capital après la levée de fonds.` });
  if (s.maxUnpaid >= 4) out.push({ k: 'bad', x: `Les fondateurs sont restés ${s.maxUnpaid} trimestres d’affilée sans rémunération. Était-ce une perte acceptable pour vous (module I, effectuation) ?` });
  const fins = [s.used.intelaka && 'crédit Intelaka et Start-TPE', s.techStart && 'subvention Tech Start', s.used.honneur && 'prêt d’honneur', s.angel && 'business angel'].filter(Boolean);
  out.push({ k: 'info', x: fins.length ? `Financements mobilisés : ${fins.join(', ')}.` : 'Aucun financement extérieur : vous avez avancé uniquement avec l’apport des associés et vos ventes.' });
  return out;
}

function summaryText(s) {
  const sc = SCEN[s.scen], f = finalScore(s);
  return [
    `Start-up Sud · ${sc.name}`,
    `Équipe : ${s.equipe || 'non renseignée'} · Code de partie : ${s.code}`,
    `Issue : ${f.survived ? 'entreprise en activité après 12 trimestres' : 'cessation de paiements en T' + f.quarters}`,
    `Valeur des parts des fondateurs : ${fmt(f.value)} (part détenue ${Math.round(f.founderShare * 100)} %)`,
    `Clients actifs : ${f.clients} · CA cumulé : ${fmt(f.caTot)} · Résultat cumulé : ${fmt(f.resTot)}`,

}

/* Code de contrôle : résultat encodé + empreinte, pour le classement établi par l’enseignant */

const HCOLS = ['t', 'CA', 'res', 'cash', 'cli', 'new', 'lost', 'churn', 'q', 'unit', 'sub', 'mkt', 'rd', 'intv', 'pay', 'sales', 'tech'];
function financings(s) {

  if (s.techStart) out.push(['S', s.techStart.t, Math.round(s.techStart.used)]);
  if (s.angel) out.push(['A', s.angel.t, Math.round(s.angel.invest), Math.round(s.angel.share * 1000)]);

}
function resultToken(s) {

  const p = JSON.stringify({ e: (s.equipe || '').slice(0, 40), c: s.code, s: s.scen, v: f.value, n: f.clients, ca: Math.round(f.caTot), r: Math.round(f.resTot), ok: f.survived ? 1 : 0, fp: f.firstProfit || 0, q: s.interviews,
    st: s.statut, fs: Math.round(f.founderShare * 1000), inc: s.incub ? 1 : 0, ap: s.apport, fin: financings(s), h });

function parseTokens(text) {

  }

}

const esc = v => String(v ?? '').replace(/[&<>"']/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
const fmt = v => E.fmt(v);
const fmtN = v => Math.round(v).toLocaleString('fr-FR').replace(/ | /g, ' ');
const fmtK = v => { const a = Math.abs(v); return (v < 0 ? '−' : '') + (a >= 1e6 ? (a / 1e6).toFixed(a >= 1e7 ? 0 : 1).replace('.', ',') + ' M' : a >= 1000 ? Math.round(a / 1000) + ' k' : Math.round(a)); };
const pct = (v, d = 0) => (v * 100).toFixed(d).replace('.', ',') + ' %';
const ICON = {
  info: '<svg width="16" height="16" viewBox="0 0 16 16" aria-hidden="true"><circle cx="8" cy="8" r="7" fill="none" stroke="currentColor" stroke-width="1.5"/><path d="M8 7v4.5M8 4.6v.1" stroke="currentColor" stroke-width="1.6" stroke-linecap="round"/></svg>',
  good: '<svg width="16" height="16" viewBox="0 0 16 16" aria-hidden="true"><circle cx="8" cy="8" r="7" fill="none" stroke="currentColor" stroke-width="1.5"/><path d="M5 8.2l2 2 4-4.2" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"/></svg>',
  bad: '<svg width="16" height="16" viewBox="0 0 16 16" aria-hidden="true"><path d="M8 1.8l6.6 11.7H1.4z" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linejoin="round"/><path d="M8 6.5v3.2M8 11.6v.1" stroke="currentColor" stroke-width="1.6" stroke-linecap="round"/></svg>',
  check: '<svg width="12" height="12" viewBox="0 0 12 12" aria-hidden="true"><path d="M2.5 6.2l2.3 2.3 4.7-5" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/></svg>'
};
ICON.warn = ICON.bad; ICON.event = ICON.info;
const note = (k, x) => `<div class="note ${k}">${ICON[k] || ICON.info}<div>${x}</div></div>`;

/* ---------- état et sauvegarde ---------- */
const SAVE_KEY = 'startupsouss.save.v1';
let G = null, view = 'play', dashTab = 'charts', confirmKey = null;
let cfg = { scen: 'solar', equipe: '', code: 'SUD-2026', apport: 100000, statut: 'AE', incub: false };
function save() { try { if (G) localStorage.setItem(SAVE_KEY, JSON.stringify(G)); else localStorage.removeItem(SAVE_KEY); } catch (e) {} }
function loadSave() { try { const v = JSON.parse(localStorage.getItem(SAVE_KEY) || 'null'); return v && v.v === 1 && S[v.scen] ? v : null; } catch (e) { return null; } }
try { const c = JSON.parse(localStorage.getItem('startupsouss.cfg') || 'null'); if (c) cfg = Object.assign(cfg, c); } catch (e) {}
function saveCfg() { try { localStorage.setItem('startupsouss.cfg', JSON.stringify(cfg)); } catch (e) {} }

/* ---------- navigation ---------- */
document.querySelectorAll('[data-nav]').forEach(b => b.addEventListener('click', () => { view = b.dataset.nav; render(); window.scrollTo({ top: 0 }); }));
function render() {
  document.querySelectorAll('[data-nav]').forEach(b => b.setAttribute('aria-current', b.dataset.nav === view ? 'page' : 'false'));
  if (view === 'board') return renderBoard();
  if (view === 'rules') return renderRules();
  if (!G) return renderSetup();
  if (G.phase === 'end') return renderEnd();
  return renderGame();
}

/* ---------- accueil ---------- */
function renderSetup() {
  const saved = loadSave();
  const sc = S[cfg.scen];
  app.innerHTML = `
  <section class="hero">
    <div>
      <div class="eyebrow">Module Entrepreneuriat · Bachelor SDSI et GEII</div>
      <h1>Dirigez une start-up du Sud pendant trois ans.</h1>
      <p>Chaque trimestre, fixez vos prix, votre marketing, votre R&D et vos recrutements, menez des entretiens clients et mobilisez les dispositifs marocains de financement. Votre objectif : une entreprise solvable et la plus grande valeur possible pour les fondateurs à la fin du trimestre T12.</p>
    </div>
    <div class="facts">
      <div class="fact"><b>12</b><span>trimestres de décision</span></div>
      <div class="fact"><b>3</b><span>projets au choix</span></div>
      <div class="fact"><b>7</b><span>sources de financement</span></div>
    </div>
  </section>
  ${saved && saved.phase !== 'end' ? `<div class="card pad row" style="margin-bottom:18px;justify-content:space-between">
      <div><b>Partie en cours</b><div class="small muted">${esc(S[saved.scen].name)} · ${esc(saved.equipe || 'équipe sans nom')} · trimestre T${saved.t} · code ${esc(saved.code)}</div></div>
      <div class="row"><button class="btn primary" id="resume">Reprendre la partie</button></div></div>` : ''}
  <div class="eyebrow" style="margin-bottom:10px">1 · Choisissez votre projet</div>
  <div class="scen-grid">
    ${Object.values(S).map(x => `
    <button class="scen" data-scen="${x.id}" aria-pressed="${cfg.scen === x.id}">
      <span class="tick">${cfg.scen === x.id ? ICON.check : ''}</span>
      <span class="chip info">${x.filiere}</span>
      <h3>${x.name}</h3>
      <span class="small muted">${x.tag}</span>
      <span class="small">${x.pitch}</span>
      <span class="kv"><span>Marché<b>${fmtN(x.market)} ${x.client.split(' ')[0]}</b></span><span>Prix de départ<b>${x.hasUnit ? fmtN(x.unit.def) + ' DH + ' : ''}${fmtN(x.sub.def)} DH/mois</b></span><span>Prototype<b>${x.protoCost ? fmtK(x.protoCost) + ' DH' : 'aucun'}</b></span></span>
    </button>`).join('')}
  </div>
  <div class="eyebrow" style="margin:22px 0 10px">2 · Constituez l’entreprise</div>
  <div class="card pad">
    <div class="setup-grid">
      <div class="field"><label for="equipe">Nom de l’équipe</label><input class="text" id="equipe" maxlength="40" placeholder="Ex. Équipe Argane" value="${esc(cfg.equipe)}"><div class="help">Il apparaîtra dans le classement de la promotion.</div></div>
      <div class="field"><label for="code">Code de partie</label><input class="text mono" id="code" maxlength="24" value="${esc(cfg.code)}"><div class="help">Avec le même code, toutes les équipes affrontent le même marché et les mêmes événements : seules les décisions font la différence. Utilisez le code donné par votre enseignant.</div></div>
      <div class="field">
        <div class="slider"><span class="lbl">Apport des associés</span><output class="num" id="apportOut">${fmt(cfg.apport)}</output>
        <input type="range" id="apport" min="20000" max="150000" step="5000" value="${cfg.apport}" aria-label="Apport des associés">
        <span class="help">Vos économies et celles de votre associé s’élèvent à 200 000 DH. Ce qui n’est pas apporté reste disponible pour un apport complémentaire.</span></div>
      </div>
      <div class="field">
        <span class="lbl">Statut juridique</span>
        <div class="seg" role="group" aria-label="Statut juridique">
          <button data-statut="AE" aria-pressed="${cfg.statut === 'AE'}">Auto-entrepreneur</button>
          <button data-statut="SARL" aria-pressed="${cfg.statut === 'SARL'}">SARL</button>
        </div>
        <div class="help">${cfg.statut === 'AE'
          ? `Impôt de ${pct(sc.aeRate, 1)} du chiffre d’affaires, sans frais de création. Plafond annuel de ${fmt(sc.aeCeil)} pour une activité de ${sc.aeLabel}. Un investisseur ne peut pas entrer au capital.`
          : 'Frais de création de 6 000 DH et 3 000 DH de frais de gestion par trimestre. Impôt sur les sociétés de 20 % du bénéfice (cotisation minimale de 0,25 % du chiffre d’affaires). Ouvre la levée de fonds.'}</div>
      </div>
      <label class="check" style="grid-column:1/-1"><input type="checkbox" id="incub" ${cfg.incub ? 'checked' : ''}>
        <span><b>Candidater à l’incubateur de l’Université Ibn Zohr</b><br><span class="small muted">Loyer de 3 000 DH par trimestre au lieu de 9 000 DH, et accès aux dispositifs Innov Invest (subvention Tech Start, prêt d’honneur). Vous pourrez aussi y entrer plus tard.</span></span></label>
    </div>
    <div class="row" style="margin-top:18px;justify-content:space-between">

  </div>`;
  app.querySelectorAll('[data-scen]').forEach(b => b.onclick = () => { cfg.scen = b.dataset.scen; saveCfg(); renderSetup(); });
  app.querySelectorAll('[data-statut]').forEach(b => b.onclick = () => { cfg.statut = b.dataset.statut; saveCfg(); renderSetup(); });
  $('#equipe').oninput = e => { cfg.equipe = e.target.value; saveCfg(); };
  $('#code').oninput = e => { cfg.code = e.target.value; saveCfg(); };
  $('#apport').oninput = e => { cfg.apport = +e.target.value; $('#apportOut').textContent = fmt(cfg.apport); saveCfg(); };
  $('#incub').onchange = e => { cfg.incub = e.target.checked; saveCfg(); };
  $('#start').onclick = () => {
    const code = (cfg.code || '').trim() || 'SUD-2026';
    G = E.newGame(Object.assign({}, cfg, { code, equipe: cfg.equipe.trim() }));

  const r = $('#resume'); if (r) r.onclick = () => { G = saved; render(); };

/* ---------- jeu ---------- */
function lastR() { return G.hist[G.hist.length - 1]; }
function kpis() {
  const R = lastR(), P = G.hist[G.hist.length - 2];
  const delta = (a, b, f) => (b == null ? '' : (a - b >= 0 ? '+' : '−') + f(Math.abs(a - b)));
  const items = [
    ['Trésorerie', fmt(G.cash), G.cash < 0, `Dette : ${fmtK(E.debtLeft(G))} DH`],
    ['Clients actifs', fmtN(G.clients), false, R ? `+${R.newC + R.dealC} / −${Math.round(R.lost)} au dernier trimestre` : 'aucun pour l’instant'],
    ['CA du trimestre', R ? fmt(R.CA) : '—', false, R && P ? delta(R.CA, P.CA, v => fmtK(v) + ' DH') + ' vs précédent' : 'dernier trimestre clos'],
    ['Résultat net', R ? fmt(R.result) : '—', R && R.result < 0, R ? `Cumul : ${fmtK(G.hist.reduce((a, q) => a + q.result, 0))} DH` : 'dernier trimestre clos'],
    ['Notoriété', pct(G.A), false, `du marché vous connaît`],
    ['Qualité perçue', Math.round(G.quality) + ' / 100', false, G.mvp ? 'produit en vente' : `${S[G.scen].mvpLabel} en cours`]
  ];
  return `<div class="kpis">${items.map(([k, v, neg, d]) => `<div class="card kpi"><div class="k">${k}</div><div class="v ${neg ? 'neg' : ''}">${v}</div><div class="d">${d}</div></div>`).join('')}</div>`;
}
function timeline() {
  const n = G.hist.length;
  return `<div class="timeline" aria-label="Trimestre ${G.t} sur 12">${Array.from({ length: 12 }, (_, i) => `<span class="${i < n ? (G.failed && i === n - 1 ? 'fail' : 'done') : (i === G.t - 1 ? 'now' : '')}" title="T${i + 1}"></span>`).join('')}</div>
  <div class="years"><span>Année 1 · T1–T4</span><span style="text-align:center">Année 2 · T5–T8</span><span style="text-align:right">Année 3 · T9–T12</span></div>`;
}

function renderGame() {
  const sc = S[G.scen];
  const yr = Math.ceil(G.t / 4), q = ((G.t - 1) % 4) + 1;
  app.innerHTML = `
  <div class="topbar">
    <h2>${sc.name} <span class="muted" style="font-weight:500">· ${esc(G.equipe || 'équipe sans nom')}</span></h2>
    <span class="chip info">Année ${yr} · trimestre ${q}</span>
    <span class="chip">${G.statut === 'AE' ? 'Auto-entrepreneur' : 'SARL'}</span>
    ${G.incub ? '<span class="chip">Incubée</span>' : ''}
    <span class="chip mono" title="Code de partie">${esc(G.code)}</span>
    <button class="btn ghost" id="quit">${confirmKey === 'quit' ? 'Confirmer l’abandon' : 'Abandonner'}</button>
  </div>
  ${timeline()}
  ${kpis()}
  <div class="game">
    <div id="left">${G.phase === 'report' ? reportHTML() : (G.phase === 'event' ? eventHTML() : '') + decisionsHTML()}</div>
    <div class="side">${G.phase === 'decide' ? `<div class="card fc-card"><div class="forecast" id="forecast"></div>
      <div class="go"><button class="btn primary big" id="validate">Valider le trimestre T${G.t}</button><span class="tiny">Prévision pour un marché moyen ; le résultat réel varie.</span></div></div>` : ''}
    <div class="card" id="dash">${dashHTML()}</div></div>
  </div>`;
  $('#quit').onclick = () => {
    if (confirmKey !== 'quit') { confirmKey = 'quit'; renderGame(); setTimeout(() => { if (confirmKey === 'quit') { confirmKey = null; if (G && view === 'play' && G.phase !== 'end') renderGame(); } }, 4000); return; }
    confirmKey = null; G = null; save(); render();
  };
  bindDash();
  if (G.phase === 'report') bindReport();
  else if (G.phase === 'event') bindEvent();
  else bindDecisions();
}

/* événement */
function eventHTML() {
  const e = E.EVENTS.find(x => x.id === G.event);
  return `<div class="event" role="region" aria-label="Événement">
    <div class="eh">${ICON.info}<div><div class="eyebrow">Événement du trimestre</div><h3>${e.title}</h3></div></div>
    <div class="eb"><p>${e.text}</p>
    <div class="choices">${e.choices.map((c, i) => `<button class="choice" data-choice="${i}"><b>${c.label}</b><span>${c.detail}</span></button>`).join('')}</div>
    <p class="tiny" style="margin-top:10px">Choisissez une option pour accéder aux décisions du trimestre.</p></div></div>`;
}
function bindEvent() { app.querySelectorAll('[data-choice]').forEach(b => b.onclick = () => { E.chooseEvent(G, +b.dataset.choice); save(); renderGame(); }); }

/* décisions */
function slider(k, label, min, max, step, val, out, help) {
  return `<div class="slider"><label class="lbl" for="d-${k}">${label}</label><output class="num" id="o-${k}">${out(val)}</output>
    <input type="range" id="d-${k}" data-k="${k}" min="${min}" max="${max}" step="${step}" value="${val}">${help ? `<span class="help" id="h-${k}">${help}</span>` : ''}</div>`;
}
function decisionsHTML() {
  const sc = S[G.scen], d = G.dec, locked = G.phase === 'event';
  const autoEv = G.event && E.EVENTS.find(x => x.id === G.event && x.auto);
  const notes = [];
  G.notes.forEach(n => notes.push(note(n.k, n.x)));
  if (autoEv) notes.push(note('info', `<b>${autoEv.title}.</b> ${autoEv.text}`));
  if (G.eventDone && G.eventNote) notes.push(note('info', G.eventNote));
  if (G.cash < 0) notes.push(note('bad', '<b>Trésorerie négative.</b> Le découvert coûte 14 % par an. Si elle est encore négative à la fin de ce trimestre, l’entreprise sera en cessation de paiements. Réduisez vos dépenses, faites un apport ou obtenez un financement.'));
  if (G.statut === 'AE' && G.hist.length) {
    const yStart = Math.floor((G.t - 1) / 4) * 4, ca = G.hist.slice(yStart).reduce((a, q) => a + q.CA, 0);
    if (ca > 0.75 * sc.aeCeil) notes.push(note('warn', `Chiffre d’affaires de l’année en cours : ${fmt(ca)}, pour un plafond de ${fmt(sc.aeCeil)} en auto-entrepreneur. Au-delà deux années de suite, le passage en société devient obligatoire.`));
  }
  const unpaidWarn = G.unpaidQ >= 2 && d.pay === 0 ? note('warn', `Les fondateurs travaillent sans rémunération depuis ${G.unpaidQ} trimestres.`) : '';
  return `
  ${notes.length ? `<div class="stack" style="margin-bottom:14px">${notes.join('')}</div>` : ''}
  <div class="card ${locked ? 'hidden' : ''}" id="decisions">
    <div class="panel-h"><h3>Décisions du trimestre T${G.t}</h3><span class="tiny">Vos choix précédents sont conservés</span></div>

    <div class="sect"><h4><span class="n">01</span> Offre et prix</h4>
      <div class="stack">
        ${sc.hasUnit ? slider('unit', sc.unit.label, sc.unit.min, sc.unit.max, sc.unit.step, d.unit, fmt, `Coût de fabrication : ${fmt(sc.unit.cost)} par boîtier`) : ''}
        ${slider('sub', sc.sub.label, sc.sub.min, sc.sub.max, sc.sub.step, d.sub, fmt, `Coût de service : ${fmt(sc.sub.cost)} par client et par mois`)}
      </div>
      <div class="est" id="priceEst"></div>
    </div>

    <div class="sect"><h4><span class="n">02</span> Marketing et entretiens clients</h4>
      <div class="stack">
        ${slider('mkt', 'Budget marketing du trimestre', 0, 120000, 2500, d.mkt, fmt, 'Fait connaître votre offre. L’effet s’use : 3 % de la notoriété se perd chaque trimestre.')}
        ${slider('interviews', 'Entretiens clients', 0, 40, 1, d.interviews, v => v + ' entretiens', 'Environ 80 DH chacun (déplacements). Ils affinent vos estimations de demande et de prix, et améliorent le produit, mais prennent du temps commercial aux fondateurs.')}
      </div>
      <div class="est" id="demandEst"></div>
    </div>

    <div class="sect"><h4><span class="n">03</span> Recherche et développement</h4>
      ${slider('rd', 'Budget R&D du trimestre', 0, 120000, 5000, d.rd, fmt, G.techStart && !G.mvp ? 'La subvention Tech Start rembourse 80 % de ce budget jusqu’au prototype.' : 'Améliore la qualité, qui augmente les ventes et réduit les départs de clients.')}
      ${!G.mvp ? `<div class="est"><div class="row" style="justify-content:space-between"><span>${sc.mvpLabel}</span><b id="mvpPct"></b></div><div class="bar"><i id="mvpBar"></i></div><div class="tiny" style="margin-top:6px">Aucune vente n’est possible avant la fin du prototype (${fmt(sc.protoCost)} de R&D cumulée). Le premier trimestre, les ventes sont réduites de moitié.</div></div>` : ''}
    </div>

    <div class="sect"><h4><span class="n">04</span> Équipe</h4>
      ${stepper('sales', 'Commerciaux', `${fmt(sc.salesSalary)} par mois · ${sc.salesCap} ventes possibles par trimestre`, d.sales)}
      ${stepper('tech', sc.techLabel, `${fmt(sc.techSalary)} par mois · ${sc.installCap < 999 ? sc.installCap + ' installations et ' : ''}${sc.serveCap} clients suivis chacun`, d.tech)}
      <div class="tiny">Recrutement : 3 000 DH par personne. Licenciement : un mois de salaire.</div>
      <div class="caps" id="caps"></div>
      <div style="margin-top:14px"><span class="lbl" style="font-weight:500;font-size:14px">Rémunération de chacun des deux fondateurs</span>
        <div class="seg" role="group" aria-label="Rémunération des fondateurs" style="margin-top:6px">
          ${[0, 3000, 6000].map(v => `<button data-pay="${v}" aria-pressed="${d.pay === v}">${v ? fmtN(v) + ' DH/mois' : 'Aucune'}</button>`).join('')}
        </div>${unpaidWarn ? `<div style="margin-top:8px">${unpaidWarn}</div>` : ''}</div>
    </div>

    <div class="sect"><h4><span class="n">05</span> Financement et structure</h4>${financeHTML()}</div>
  </div>`;
}
function stepper(k, label, sub, v) {
  return `<div class="stepper"><div class="who">${label}<small>${sub}</small></div><div class="ctl"><button data-step="${k}" data-dir="-1" aria-label="Retirer : ${label}">−</button><b id="s-${k}">${v}</b><button data-step="${k}" data-dir="1" aria-label="Ajouter : ${label}">+</button></div></div>`;
}

function chipFor(st) {
  if (st.done) return '<span class="chip good">Obtenu</span>';
  if (st.pending) return '<span class="chip warn">En instruction</span>';
  if (st.ok) return '<span class="chip info">Disponible</span>';
  return '<span class="chip">Non accessible</span>';
}
function chance(p) { return p >= 0.7 ? 'bonnes' : p >= 0.5 ? 'moyennes' : 'faibles'; }
const finAmt = { apport: 20000, intelaka: 200000, honneur: 150000, angel: 300000 };
function financeHTML() {
  const el = E.eligibility(G), sc = S[G.scen];
  const it = (key, title, sub, st, act) => `<div class="fi"><div class="fi-h"><div><b>${title}</b><small>${sub}</small></div>${chipFor(st)}</div>${st.why ? `<div class="why">${st.why}</div>` : ''}${st.ok && act ? `<div class="act">${act}</div>` : ''}</div>`;
  const pre = E.angelPreMoney(G), inv = finAmt.angel, share = inv / (pre + inv);
  finAmt.apport = Math.min(finAmt.apport, G.savings) || 0;
  return `<div class="fin">
    ${it('apport', 'Apport complémentaire des associés', `Épargne disponible : ${fmt(G.savings)}`, el.apport,
      `<select id="f-apport" aria-label="Montant de l’apport">${[10000, 20000, 30000, 50000, 75000, 100000, 150000].filter(v => v <= G.savings).concat(G.savings % 10000 && G.savings < 150000 ? [G.savings] : []).map(v => `<option value="${v}" ${v === finAmt.apport ? 'selected' : ''}>${fmt(v)}</option>`).join('')}</select><button class="btn" data-fin="apport">Apporter</button>`)}
    ${it('incub', 'Incubateur de l’Université Ibn Zohr', 'Loyer réduit à 3 000 DH ; ouvre Tech Start et le prêt d’honneur', el.incub, '<button class="btn" data-fin="incub">Entrer à l’incubateur</button>')}
    ${it('intelaka', 'Crédit bancaire Intelaka', 'Taux de 2 %, garanti par Tamwilcom ; remboursement sur 5 ans après 1 an de différé ; complété par un prêt Start-TPE à 0 %', el.intelaka,
      `${slider('intelaka', 'Montant demandé', 50000, 500000, 10000, finAmt.intelaka, fmt)}<span class="small muted" id="intelakaP">Chances : ${chance(E.intelakaProb(G, finAmt.intelaka))}</span><button class="btn" data-fin="intelaka">Déposer le dossier</button>`)}
    ${sc.innov ? it('techStart', 'Subvention Tech Start (Innov Invest)', '80 % des dépenses de R&D remboursées jusqu’au prototype, dans la limite de 200 000 DH ; non remboursable', el.techStart,
      `<span class="small muted">Chances : ${chance(E.techStartProb(G))}</span><button class="btn" data-fin="techStart">Déposer le dossier</button>`) : ''}
    ${it('honneur', 'Prêt d’honneur', 'Sans intérêt ni garantie ; remboursable sur 4 ans après 2 ans de différé', el.honneur,
      `${slider('honneur', 'Montant demandé', 50000, 300000, 10000, finAmt.honneur, fmt)}<span class="small muted">Chances : ${chance(E.honneurProb(G))}</span><button class="btn" data-fin="honneur">Déposer le dossier</button>`)}
    ${it('sarl', 'Transformation en SARL', '6 000 DH de frais ; impôt sur les sociétés ; nécessaire pour accueillir un investisseur', el.sarl, '<button class="btn" data-fin="sarl">Passer en SARL</button>')}
    ${it('angel', 'Business angel', 'Entrée immédiate au capital en échange d’une part de l’entreprise', el.angel,
      `<select id="f-angel" aria-label="Montant de la levée">${[100000, 200000, 300000, 500000, 800000].map(v => `<option value="${v}" ${v === inv ? 'selected' : ''}>${fmt(v)}</option>`).join('')}</select>

function updatePanel() {
  const sc = S[G.scen], d = G.dec, est = E.estimates(G);
  // prix
  const annual = (sc.hasUnit ? d.unit : 0) + 12 * d.sub;
  const pos = annual < est.refLo ? 'en dessous de la fourchette : attractif, mais vous laissez peut-être de la marge' : annual > est.refHi ? 'au-dessus de la fourchette : beaucoup de prospects vont refuser' : 'dans la fourchette';
  $('#priceEst').innerHTML = `Prix pour un client sur un an (${sc.priceLabel}) : <b>${fmt(annual)}</b><br>Prix jugé acceptable, d’après vos entretiens : <b>${fmtN(est.refLo)} – ${fmt(est.refHi)}</b>, soit un prix <b style="font-family:inherit;font-weight:600">${pos}</b>.`;
  const lvl = v => v < 0.85 ? 'faible' : v < 1.15 ? 'moyenne' : 'forte';
  $('#demandEst').innerHTML = `<div class="row" style="justify-content:space-between"><span>Précision de vos estimations (${est.n} entretiens réalisés)</span><b>${pct(est.precision)}</b></div><div class="bar"><i style="width:${Math.round(est.precision * 100)}%"></i></div>
    <div style="margin-top:8px">Intensité du besoin estimée : entre <b>${lvl(est.dmLo)}</b> et <b>${lvl(est.dmHi)}</b> (indice ${est.dmLo.toFixed(2).replace('.', ',')} à ${est.dmHi.toFixed(2).replace('.', ',')} ; 1 = moyenne).</div>`;
  if (!G.mvp) { const p = Math.min(1, (G.rdCum + d.rd) / sc.protoCost); $('#mvpPct').textContent = `${pct(Math.min(1, G.rdCum / sc.protoCost))} → ${pct(p)}`; $('#mvpBar').style.width = (p * 100) + '%'; }
  // prévision
  const { R } = E.simulate(G, true);
  const willSell = G.mvp || G.rdCum + d.rd >= sc.protoCost;
  const caps = [['Demande attendue', R.leads, 'demand'], ['Capacité commerciale', R.salesCap, 'sales']];
  if (R.instCap != null) caps.push(['Capacité d’installation', R.instCap, 'inst']);
  const binding = willSell ? caps.reduce((a, c) => c[1] < a[1] ? c : a) : null;
  const serveTxt = `${fmtN(R.clients)} / ${fmtN(R.serveCap)}`;
  $('#caps').innerHTML = caps.map(c => `<div class="${binding && c === binding && c[2] !== 'demand' ? 'lim' : ''}">${c[0]}<b>${willSell ? fmtN(c[1]) : '—'}</b></div>`).join('') + (R.instCap == null ? '' : '') +
    `<div class="${R.clients > R.serveCap ? 'lim' : ''}">Clients suivis / capacité<b>${serveTxt}</b></div>`;
  const lim = !willSell ? `Pas de vente ce trimestre : le développement (${sc.mvpLabel.toLowerCase()}) n’est pas terminé.` :
    binding[2] === 'demand' ? 'Facteur limitant : la demande. Marketing, prix ou qualité.' :
    binding[2] === 'sales' ? 'Facteur limitant : votre capacité commerciale. Des prospects resteront sans réponse.' : 'Facteur limitant : votre capacité d’installation.';
  const fc = $('#forecast');
  fc.innerHTML = `<div class="row" style="justify-content:space-between"><b>Prévision pour T${G.t}</b><span class="tiny">${lim}</span></div>
    <div class="g"><div>Nouveaux clients<b>${fmtN(R.newC + R.dealC)}</b></div><div>Chiffre d’affaires<b>${fmtK(R.CA)} DH</b></div><div>Résultat net<b class="${R.result < 0 ? 'neg' : ''}">${fmtK(R.result)} DH</b></div><div>Trésorerie en fin de trimestre<b class="${R.cash < 0 ? 'neg' : ''}">${fmtK(R.cash)} DH</b></div></div>
    ${R.cash < 0 ? `<div style="margin-top:10px">${note('bad', G.cash < 0 ? 'Avec ces décisions, la trésorerie resterait négative : cessation de paiements à la fin du trimestre.' : 'Avec ces décisions, la trésorerie deviendrait négative. Vous auriez un trimestre pour la rétablir.')}</div>` : ''}
    ${R.churn > 0.1 && G.clients > 0 ? `<div style="margin-top:10px">${note('warn', `Taux de départ prévu : ${pct(R.churn, 1)} des clients. Votre équipe est-elle assez grande pour les suivre ?`)}</div>` : ''}`;
}

function bindDecisions() {
  const panel = $('#decisions'); if (!panel) return;

    $('#s-' + k).textContent = G.dec[k]; updatePanel(); save();
  });
  panel.querySelectorAll('[data-pay]').forEach(b => b.onclick = () => {
    G.dec.pay = +b.dataset.pay; panel.querySelectorAll('[data-pay]').forEach(x => x.setAttribute('aria-pressed', x === b)); updatePanel(); save();
  });
  panel.querySelectorAll('[data-fin]').forEach(b => b.onclick = () => {

/* ---------- tableau de bord ---------- */
const CH = {}; let CW = 560;
function niceTicks(lo, hi, n = 4) {
  if (lo === hi) { hi = lo + 1; }
  const span = hi - lo, step0 = span / n, mag = Math.pow(10, Math.floor(Math.log10(step0)));
  const step = [1, 2, 2.5, 5, 10].map(m => m * mag).find(s => s >= step0);
  const a = Math.floor(lo / step) * step, b = Math.ceil(hi / step) * step, t = [];
  for (let v = a; v <= b + step / 2; v += step) t.push(Math.round(v));
  return t;
}
function chart(id, type, labels, series, opts = {}) {
  CH[id] = { labels, series, opts };
  const W = CW, H = Math.round(Math.max(180, Math.min(230, CW * 0.36))), L = 54, Rr = 14, T = 12, B = 26, iw = W - L - Rr, ih = H - T - B;
  const all = series.flatMap(s => s.values);
  let lo = Math.min(0, ...all), hi = Math.max(0, ...all);
  const ticks = niceTicks(lo, hi); lo = ticks[0]; hi = ticks[ticks.length - 1];
  const y = v => T + ih - (v - lo) / (hi - lo) * ih;
  const n = labels.length, bw = iw / Math.max(n, 1), x = i => L + bw * (i + 0.5);
  let g = ticks.map(t => `<line x1="${L}" x2="${W - Rr}" y1="${y(t)}" y2="${y(t)}" stroke="var(--grid)" stroke-width="1"/><text x="${L - 8}" y="${y(t) + 4}" text-anchor="end" font-size="11" fill="var(--ink-3)" font-family="IBM Plex Mono">${fmtK(t)}</text>`).join('');
  g += `<line x1="${L}" x2="${W - Rr}" y1="${y(0)}" y2="${y(0)}" stroke="var(--line-2)" stroke-width="1"/>`;
  const every = n > 8 ? 2 : 1;
  g += labels.map((l, i) => i % every === 0 || i === n - 1 ? `<text x="${x(i)}" y="${H - 6}" text-anchor="middle" font-size="11" fill="var(--ink-3)" font-family="IBM Plex Mono">${l}</text>` : '').join('');
  let marks = '';
  if (type === 'bar') {
    const k = series.length, gap = 2, inner = Math.min(bw * 0.72, 44), w = (inner - gap * (k - 1)) / k;
    series.forEach((s, si) => s.values.forEach((v, i) => {
      const x0 = x(i) - inner / 2 + si * (w + gap), y0 = y(Math.max(0, v)), h = Math.max(1, Math.abs(y(v) - y(0)));
      const r = Math.min(4, w / 2, h);
      // extrémité arrondie côté donnée, ancrée sur la ligne de base
      const top = v >= 0;
      const p = top ? `M${x0},${y(0)}V${y0 + r}Q${x0},${y0} ${x0 + r},${y0}H${x0 + w - r}Q${x0 + w},${y0} ${x0 + w},${y0 + r}V${y(0)}Z`
                    : `M${x0},${y(0)}V${y(v) - r}Q${x0},${y(v)} ${x0 + r},${y(v)}H${x0 + w - r}Q${x0 + w},${y(v)} ${x0 + w},${y(v) - r}V${y(0)}Z`;
      marks += `<path d="${p}" fill="${s.color}"/>`;
    }));
  } else {
    series.forEach(s => {
      const pts = s.values.map((v, i) => `${x(i)},${y(v)}`);
      marks += `<polyline points="${pts.join(' ')}" fill="none" stroke="${s.color}" stroke-width="${s.width || 2}"${s.dash ? ` stroke-dasharray="${s.dash}"` : ''} stroke-linejoin="round" stroke-linecap="round"/>`;
      const li = s.values.length - 1;
      if (li >= 0 && s.dot !== false) {
        marks += `<circle cx="${x(li)}" cy="${y(s.values[li])}" r="4" fill="${s.color}" stroke="var(--surface)" stroke-width="2"/>`;
        if (opts.endLabel) marks += `<text x="${Math.min(x(li), W - Rr)}" y="${y(s.values[li]) - 9}" text-anchor="${li > n / 2 ? 'end' : 'middle'}" font-size="11.5" fill="var(--ink)" font-family="IBM Plex Mono" font-weight="500">${opts.endLabel(s.values[li])}</text>`;
      }
    });
  }
  const hits = labels.map((_, i) => `<rect class="hit" data-i="${i}" x="${L + bw * i}" y="${T}" width="${bw}" height="${ih}" fill="transparent"/>`).join('');
  const leg = []; series.forEach(s => { if (!leg.some(l => l.name === s.name)) leg.push(s); });
  const legend = leg.length > 1 ? `<div class="legend">${leg.map(s => `<span><i style="background:${s.color}${s.dash ? ';height:3px;vertical-align:3px' : ''}"></i>${esc(s.name)}</span>`).join('')}</div>` : '';
  return `<div class="chart" data-chart="${id}"><h4 style="font-size:14px;margin-bottom:4px">${opts.title}</h4>${legend}
    <svg viewBox="0 0 ${W} ${H}" role="img" aria-label="${opts.title}">${g}<g class="hover"></g>${marks}${hits}</svg><div class="tip"></div></div>`;
}
function bindCharts() {
  app.querySelectorAll('[data-chart]').forEach(el => {
    const c = CH[el.dataset.chart], tip = $('.tip', el), hov = $('.hover', el), svg = $('svg', el);
    const show = i => {
      const r = $(`rect[data-i="${i}"]`, el), bb = r.getBBox();
      hov.innerHTML = `<rect x="${bb.x}" y="${bb.y}" width="${bb.width}" height="${bb.height}" fill="var(--accent-soft)" opacity=".7"/>`;
      tip.innerHTML = `<b>${c.labels[i]}</b>` + c.series.filter(s => s.tip !== false && s.values[i] != null).map(s => `<div><span>${esc(s.name)}</span><span class="num">${(c.opts.fmt || fmt)(s.values[i])}</span></div>`).join('');
      tip.style.display = 'block';
      const sr = svg.getBoundingClientRect(), scale = sr.width / CW, left = (bb.x + bb.width / 2) * scale;
      const tw = tip.offsetWidth; tip.style.left = Math.max(0, Math.min(sr.width - tw, left - tw / 2)) + 'px'; tip.style.top = (sr.top - el.getBoundingClientRect().top + 6) + 'px';
    };
    const hide = () => { tip.style.display = 'none'; hov.innerHTML = ''; };
    el.querySelectorAll('.hit').forEach(r => { r.addEventListener('mouseenter', () => show(+r.dataset.i)); r.addEventListener('click', () => show(+r.dataset.i)); });
    svg.addEventListener('mouseleave', hide);
  });
}

async function downloadText(name, text, type) {
  if (!STANDALONE) {

      const d = window.claude && typeof window.claude.use === 'function' ? await window.claude.use('downloads') : null;
      if (!d) throw new Error('unavailable');
      await d.save({ filename: name, data: new Blob([text], { type: (type || 'text/plain') + ';charset=utf-8' }) });
    } catch (e) { const m = $('#copyMsg'); if (m && !(e && e.code === 'dismissed')) m.textContent = 'Téléchargement impossible ici : utilisez « Copier la fiche ».'; }

  }
  const a = document.createElement('a');
  a.href = URL.createObjectURL(new Blob([text], { type: (type || 'text/plain') + ';charset=utf-8' }));
  a.download = name; document.body.appendChild(a); a.click();
  setTimeout(() => { URL.revokeObjectURL(a.href); a.remove(); }, 500);
}

const FIN = { I: 'Intelaka', P: 'Start-TPE', H: 'Prêt d’honneur', S: 'Tech Start', A: 'Business angel' };
function col(r, k) { const i = E.HCOLS.indexOf(k); return (r.h || []).map(h => h[i]); }
function compareHTML(rows) {
  const det = rows.filter(r => Array.isArray(r.h) && r.h.length);
  const old = rows.length - det.length;
  if (!det.length) return `<div class="card pad" style="margin-bottom:18px">${note('info', 'Ces fiches viennent d’une ancienne version du jeu : elles ne contiennent que le bilan final. Les fiches des nouvelles parties contiennent aussi le détail des 12 trimestres.')}</div>`;
  if (!det.some(r => r.raw === cmp.team)) cmp.team = det[0].raw;
  const sel = det.find(r => r.raw === cmp.team), [title, key, f] = METRICS[cmp.metric];
  const labels = Array.from({ length: 12 }, (_, i) => 'T' + (i + 1));
  const others = det.filter(r => r !== sel).map(r => ({ name: 'Autres groupes', color: 'var(--line-2)', width: 1.25, dot: false, tip: false, values: col(r, key) }));
  const med = labels.map((_, i) => { const v = det.map(r => col(r, key)[i]).filter(x => x != null).sort((a, b) => a - b); return v.length ? (v.length % 2 ? v[(v.length - 1) / 2] : (v[v.length / 2 - 1] + v[v.length / 2]) / 2) : null; });
  const medN = med.findIndex(v => v == null); const medVals = medN === -1 ? med : med.slice(0, medN);
  CW = Math.max(300, Math.min(1100, app.clientWidth - 42));

  const sum = (r, k) => col(r, k).reduce((a, v) => a + v, 0), avg = (r, k) => { const c = col(r, k); return c.length ? sum(r, k) / c.length : 0; };
  return `<div class="card" style="margin-bottom:18px">

        <label class="row small" style="gap:8px">Groupe mis en évidence <select id="cmpTeam" class="text" style="width:auto;min-height:38px">${det.map(r => `<option value="${esc(r.raw)}" ${r === sel ? 'selected' : ''}>${esc(r.e || 'Sans nom')}</option>`).join('')}</select></label>
      </div>
      ${chart('cmp', 'line', labels, series, { title, fmt: f })}
      <p class="tiny">Le groupe choisi est en trait plein foncé, la médiane de la classe en pointillés, les autres groupes en gris. Survolez un trimestre pour lire les valeurs.</p>
    </div>
    <div class="sect" style="border-top:1px solid var(--line)"><h4>Décisions et financements par groupe</h4>
      <div class="tblwrap"><table class="t"><thead><tr><th>Équipe</th><th>Statut</th><th>Incubé</th><th>Apport</th><th>Abonnement moyen</th><th>Marketing cumulé</th><th>R&D cumulée</th><th>Entretiens</th><th>Équipe finale</th><th>Rémun. fondateur moyenne</th><th>1<sup>er</sup> bénéfice</th><th>Trésorerie la plus basse</th><th style="text-align:left">Financements obtenus</th></tr></thead><tbody>
      ${det.map(r => { const last = r.h[r.h.length - 1], d = Object.fromEntries(E.HCOLS.map((k, i) => [k, last[i]])); return `<tr${r === sel ? ' style="font-weight:600"' : ''}>
        <td>${esc(r.e || 'Sans nom')}</td><td>${r.st === 'SARL' ? 'SARL' : 'AE'}</td><td>${r.inc ? 'oui' : 'non'}</td><td class="num">${fmtN(r.ap || 0)}</td>
        <td class="num">${fmtN(avg(r, 'sub'))}</td><td class="num">${fmtN(sum(r, 'mkt'))}</td><td class="num">${fmtN(sum(r, 'rd'))}</td><td class="num">${fmtN(sum(r, 'intv'))}</td>
